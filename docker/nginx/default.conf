## Main server for calamina.cafe — serve static files, no HTTP->HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name calamina.cafe;

    root /usr/share/nginx/html;
    index index.html;

    # Serve a custom 404 page produced by the Astro build. When a request
    # results in a 404, nginx will internally serve /404.html as the response
    # body while preserving the 404 status code.
    error_page 404 /404.html;

    # Serve the 404 page internally to avoid it being indexed or accessed
    # directly; direct requests to /404.html will return 404. The 404 page
    # itself is short-lived in cache so changes propagate quickly.
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Pure static site: return 404 when a file is not found (no SPA fallback)
    location / {
        try_files $uri $uri/ =404;
    }

    # Caching: long for immutable assets (assumes content-hashed filenames)
    location ~* \.(?:css|js|mjs|json|avif|webp|png|jpg|jpeg|svg|gif|ico)$ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Vary "Accept-Encoding" always;
    }

    # Fonts: long cache and allow cross-origin requests
    location ~* \.(?:woff2|woff|ttf|otf|eot)$ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Vary "Accept-Encoding" always;
    }

    # HTML: short cache so changes take effect quickly
    location ~* \.html?$ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Optional: small security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # HSTS (Strict-Transport-Security) — uncomment and enable only after
    # TLS is correctly provisioned and you're ready to enforce HTTPS.
    # Recommended start: enable without includeSubDomains/preload first.
    # add_header Strict-Transport-Security "max-age=31536000" always;
}
